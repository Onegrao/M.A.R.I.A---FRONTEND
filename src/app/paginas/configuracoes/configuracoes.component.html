<div class="page-container">
  <div class="content-card">
    <h2>Configurações</h2>
    <p>Gerencie as preferências da sua conta.</p> <div class="setting-option">
    <div class="setting-text">
      <h3>Notificações por Email</h3>
      <p>Receber alertas de manutenção e relatórios no seu email.</p>
    </div>
    <div class="setting-control">
      <button class="primary-button" (click)="toggleNotificacoes()">
        {{ config.notificacoesPorEmail ? 'Desativar' : 'Ativar' }}
      </button>
    </div>
  </div>

    <div class="button-group">
      <button type="button" class="secondary-button" (click)="voltar()">Voltar</button>
    </div>
  </div>
</div>
